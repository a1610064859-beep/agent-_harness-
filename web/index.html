<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财税 Agent Harness</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d232b; --muted: #66707c; --line: #e3e6ea;
  --accent: #1f6feb; --accent-soft: #e8f0fe; --ok: #1a7f37; --ok-soft: #e6f4ea;
  --warn: #9a6700; --warn-soft: #fff4d6; --bad: #c62828; --bad-soft: #fdecea;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111418; --panel: #191d23; --ink: #e6e9ed; --muted: #8b95a1; --line: #2a3038;
    --accent: #58a6ff; --accent-soft: #15233a; --ok: #3fb950; --ok-soft: #12261a;
    --warn: #d29922; --warn-soft: #2a2110; --bad: #f85149; --bad-soft: #2d1515; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
header .sub { color: var(--muted); font-size: 12px; }
main { display: grid; grid-template-columns: 280px minmax(0, 1fr) 440px; height: calc(100vh - 49px); }
section { overflow: auto; }
.left, .right { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; }
.right { border-right: 0; border-left: 1px solid var(--line); padding: 0; display: flex; flex-direction: column; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
h2:first-child { margin-top: 0; }
label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
select, input, textarea, button { font: inherit; color: inherit; }
select, input, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--bg); }
.muted { color: var(--muted); }
.chip { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; margin: 2px 4px 2px 0; background: var(--accent-soft); color: var(--accent); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chat { display: flex; flex-direction: column; min-height: 0; }
#log { flex: 1; overflow: auto; padding: 20px 24px; }
.msg { max-width: 760px; margin: 0 auto 16px; }
.msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.msg.user .bubble { background: var(--accent-soft); }
.bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.bubble p { margin: 0 0 8px; } .bubble p:last-child { margin: 0; }
.bubble table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
.bubble td, .bubble th { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
.bubble ul { margin: 4px 0 8px; padding-left: 20px; }
.event { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 16px; }
.meta { font-size: 12px; margin-top: 6px; }
.meta a { color: var(--accent); cursor: pointer; text-decoration: underline; }
.composer { border-top: 1px solid var(--line); padding: 12px 24px; background: var(--panel); }
.composer .row { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; }
.composer textarea { resize: none; height: 44px; }
.quick { max-width: 760px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { font-size: 12px; padding: 2px 10px; border-radius: 12px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; padding: 10px; border-bottom: 2px solid transparent; }
.tabs button.on { border-bottom-color: var(--accent); color: var(--accent); }
.pane { padding: 14px 16px; overflow: auto; flex: 1; }
.step { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; margin: 8px 0; }
.step.tool { border-color: var(--accent); } .step.tool.err { border-color: var(--bad); }
.step.out { border-color: var(--ok); }
details summary { cursor: pointer; }
pre { font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 6px 0; max-height: 360px; overflow: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
.blank { color: var(--warn); }
.changed { background: var(--ok-soft); }
.welcome { max-width: 760px; margin: 0 auto 16px; }
.welcome .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.welcome .scene { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); }
.welcome .scene b { display: block; margin-bottom: 6px; }
.welcome .ask { display: block; width: 100%; text-align: left; margin: 4px 0; font-size: 13px; white-space: normal; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel); min-width: 120px; }
.stat .v { font-size: 16px; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; max-width: 760px; margin: 0 auto 12px; font-size: 13px; }
form.rule { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; margin-bottom: 12px; }
form.rule textarea { grid-column: 1 / -1; height: 70px; }
form.rule .full { grid-column: 1 / -1; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px 12px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 10px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.drop input { display: none; }
.imp .issue { color: var(--bad); font-size: 12px; } .imp .note { color: var(--muted); font-size: 12px; }
.imp dl { display: grid; grid-template-columns: 88px 1fr; gap: 2px 8px; margin: 6px 0 0; font-size: 12px; }
.imp dt { color: var(--muted); } .imp dd { margin: 0; word-break: break-all; }
@media (max-width: 700px) { .welcome .grid { grid-template-columns: 1fr; } }
@media (max-width: 1100px) {
  main { grid-template-columns: 1fr; height: auto; }
  .left, .right { border: 0; border-bottom: 1px solid var(--line); }
  #log { min-height: 50vh; }
  .right { min-height: 60vh; }
}
</style>
</head>
<body>
<header>
  <h1>财税 Agent Harness</h1>
  <span class="sub" id="metaline"></span>
</header>
<main>
  <section class="left">
    <h2>会话</h2>
    <label for="user">用户</label><select id="user"></select>
    <label for="company">当前企业</label><select id="company"></select>
    <div class="muted" id="perm" style="margin:6px 0 10px;font-size:12px"></div>
    <button class="primary" id="newSession" style="width:100%">开始新会话</button>
    <div class="muted" id="sid" style="font-size:12px;margin-top:6px"></div>

    <h2>任务记忆</h2>
    <div id="task" class="muted">无</div>

    <h2>长期偏好</h2>
    <div id="prefs" class="muted">无</div>
  </section>

  <section class="chat">
    <div id="log"></div>
    <div class="composer">
      <div class="quick" id="quick"></div>
      <div class="row">
        <textarea id="input" placeholder="例如：甲企业 9 月发票和银行收支各多少？（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="primary" id="send">发送</button>
      </div>
    </div>
  </section>

  <section class="right">
    <div class="tabs">
      <button data-tab="run" class="on">运行记录</button>
      <button data-tab="data">当前数据</button>
      <button data-tab="import">导入发票</button>
      <button data-tab="rules">规则</button>
    </div>
    <div class="pane" id="pane-run"><p class="muted">发送消息后，这里显示本轮的模型输入、选用的记忆与规则、工具调用及结果。</p></div>
    <div class="pane" id="pane-data" hidden></div>
    <div class="pane" id="pane-import" hidden></div>
    <div class="pane" id="pane-rules" hidden></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const state = { meta: null, sid: null, user: null, company: null, month: "2026-09", lastRun: null };
const QUICK = ["9 月发票和银行收支各多少？", "9 月哪些发票还没填用途？", "还剩哪些没处理？",
               "记住：以后回答先给合计，再列明细", "我的记忆里都有什么？", "切到乙企业"];

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function md(text) {
  const lines = esc(text).split("\n");
  let html = "", list = false, table = [];
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter((r) => !/^\|\s*-/.test(r)).map((r) => r.replace(/^\||\|$/g, "").split("|"));
    html += "<table>" + rows.map((c, i) => "<tr>" + c.map((x) => `<${i ? "td" : "th"}>${inline(x.trim())}</${i ? "td" : "th"}>`).join("") + "</tr>").join("") + "</table>";
    table = [];
  };
  for (const raw of lines) {
    const line = raw.trim();
    if (line.startsWith("|")) { table.push(line); continue; }
    flushTable();
    if (/^[-•]\s+/.test(line) || /^\d+[.、]\s*/.test(line)) {
      if (!list) { html += "<ul>"; list = true; }
      html += "<li>" + inline(line.replace(/^[-•]\s+|^\d+[.、]\s*/, "")) + "</li>"; continue;
    }
    if (list) { html += "</ul>"; list = false; }
    if (line) html += "<p>" + inline(line.replace(/^#+\s*/, "")) + "</p>";
  }
  flushTable(); if (list) html += "</ul>";
  return html;
}

function permText() { return state.meta.permissions[`${state.user}/${state.company}`] || "无权访问"; }

async function init() {
  state.meta = await api("/api/meta");
  $("#metaline").textContent = `模型 ${state.meta.model} · 业务日期 ${state.meta.today} · 全部数据为比赛模拟内容`;
  $("#user").innerHTML = state.meta.users.map((u) => `<option value="${u.user_id}">${u.user_id} ${esc(u.name)}</option>`).join("");
  $("#company").innerHTML = state.meta.companies.map((c) => `<option value="${c.company_id}">${c.company_id} ${esc(c.short_name)}</option>`).join("");
  $("#quick").innerHTML = QUICK.map((q) => `<button>${esc(q)}</button>`).join("");
  $("#quick").onclick = (e) => { if (e.target.tagName === "BUTTON") { $("#input").value = e.target.textContent; $("#input").focus(); } };
  for (const id of ["#user", "#company"]) $(id).onchange = () => { state.user = $("#user").value; state.company = $("#company").value; $("#perm").textContent = `权限：${permText()}（换用户或企业需开始新会话）`; };
  $("#newSession").onclick = newSession;
  $("#send").onclick = send;
  $("#input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => showTab(b.dataset.tab));
  state.user = $("#user").value; state.company = $("#company").value;
  await newSession();
}

function showTab(tab) {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  for (const t of ["run", "data", "import", "rules"]) $(`#pane-${t}`).hidden = t !== tab;
  if (tab === "data") renderData(); if (tab === "rules") renderRules(); if (tab === "import") renderImport();
}

async function newSession() {
  state.user = $("#user").value; state.company = $("#company").value;
  const r = await api("/api/sessions", { method: "POST", body: JSON.stringify({ user_id: state.user, company_id: state.company }) });
  state.sid = r.session_id;
  $("#sid").textContent = `会话 ${state.sid}`;
  $("#perm").textContent = `权限：${permText()}`;
  $("#log").innerHTML = `<div class="event">新会话：${state.user} · ${state.company}（任务记忆与长期偏好会延续，未执行的修改不会自动执行）</div>`;
  if (state.meta.recovered_on_start?.length && !state.bannerShown) {
    state.bannerShown = true;
    $("#log").insertAdjacentHTML("afterbegin", `<div class="banner">启动时核对了上次中断的保存：${state.meta.recovered_on_start.map((r) =>
      `${esc(r.invoice)} ${r.verified ? "已回读确认保存成功" : "回读不一致，未保存成功"}（${esc(r.op_id)}）`).join("；")}</div>`);
  }
  await Promise.all([refreshSide(), renderWelcome()]);
  showTab("data");
}

const SCENES = [
  ["查询资料", ["9 月发票总额、银行收入和支出各多少？", "8 月的银行支出明细给我看看", "7 月的发票总额是多少？"]],
  ["补充并保存", ["9 月 F002 的用途填打印复印纸，帮我保存", "F004 用途是客户接待住宿，备注写两晚，保存", "把 F002 的金额改成 900"]],
  ["多轮检查", ["9 月哪些发票还没填用途？", "还剩哪些没处理？", "切到乙企业，看看 9 月还缺哪些用途"]],
];

async function renderWelcome() {
  const old = document.querySelector("#log .welcome");
  const ov = await api(`/api/overview?session_id=${state.sid}`);
  const name = state.meta.companies.find((c) => c.company_id === state.company)?.short_name || state.company;
  let stats = `<p class="muted">${esc(state.user)} 对 ${esc(name)} 无权访问：查询会被拒绝，系统不会把它当作“没有记录”回答 0。</p>`;
  if (!ov.forbidden) {
    const sep = ov.months.find((m) => m.month === "2026-09");
    const ps = ov.purpose_2026_09;
    stats = `<div class="stats">
      <div class="stat"><div class="v">${sep.invoice_total}</div><div class="k">9 月发票总额（元）</div></div>
      <div class="stat"><div class="v">${sep.bank_income}</div><div class="k">9 月银行收入</div></div>
      <div class="stat"><div class="v">${sep.bank_expense}</div><div class="k">9 月银行支出</div></div>
      <div class="stat"><div class="v">${ps.error ? "—" : ps.missing_required.length + " 张"}</div><div class="k">${ps.error ? esc(ps.error) : `9 月必填未填用途 · 依据 ${ps.rule.rule_id} ${ps.rule.version} 版`}</div></div>
    </div><p class="muted" style="font-size:12px;margin:6px 0 0">以上由程序直接从库内当前数据计算，供核对；对话中的数字同样来自工具查询，而不是模型自己计算。</p>`;
  }
  const div = document.createElement("div");
  div.className = "welcome";
  div.innerHTML = `<div class="card" style="background:var(--panel)"><b>${esc(name)}</b> · ${esc(state.user)}（${esc(permText())}）${stats}
    <div class="grid">${SCENES.map(([title, qs]) => `<div class="scene"><b>${title}</b>${qs.map((q) => `<button class="ask">${esc(q)}</button>`).join("")}</div>`).join("")}</div></div>`;
  div.onclick = (e) => { if (e.target.classList.contains("ask")) { $("#input").value = e.target.textContent; $("#input").focus(); } };
  if (old) old.replaceWith(div); else $("#log").appendChild(div);
}

function addMsg(role, text, meta) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<div class="who">${role === "user" ? "你" : "助手"}</div><div class="bubble">${role === "user" ? esc(text).replace(/\n/g, "<br>") : md(text)}</div>`;
  if (meta) div.appendChild(meta);
  $("#log").appendChild(div);
  $("#log").scrollTop = $("#log").scrollHeight;
  return div;
}

async function send() {
  const text = $("#input").value.trim();
  if (!text || !state.sid) return;
  $("#input").value = ""; $("#send").disabled = true;
  addMsg("user", text);
  const wait = addMsg("assistant", "处理中…");
  try {
    const r = await api(`/api/sessions/${state.sid}/messages`, { method: "POST", body: JSON.stringify({ text }) });
    wait.remove();
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = r.tool_calls.map((c) => `<span class="chip ${c.ok ? "ok" : "bad"}">${esc(c.tool)}${c.ok ? "" : " · " + esc(c.error)}</span>`).join("")
      + (r.anomalies.length ? `<span class="chip warn">异常 ${r.anomalies.length}</span>` : "")
      + ` <a data-run="${r.run_id}">运行记录 ${r.run_id}</a>`;
    meta.querySelector("a").onclick = () => showRun(r.run_id);
    addMsg("assistant", r.reply, meta);
    if (r.company_id !== state.company) {
      state.company = r.company_id; $("#company").value = r.company_id;
      $("#perm").textContent = `权限：${permText()}`;
      const ev = document.createElement("div"); ev.className = "event"; ev.textContent = `当前企业已切换为 ${r.company_id}`;
      $("#log").appendChild(ev);
    }
    await Promise.all([refreshSide(), showRun(r.run_id)]);
  } catch (e) {
    wait.querySelector(".bubble").innerHTML = `<span style="color:var(--bad)">请求失败：${esc(e.message)}</span>`;
  } finally { $("#send").disabled = false; $("#input").focus(); }
}

async function refreshSide() {
  const m = await api(`/api/memory?session_id=${state.sid}`);
  const t = m.task;
  $("#task").innerHTML = t ? `<div class="card"><div>目标：${esc(t.goal || "（未记录）")}</div><div>月份：${esc(t.month || "未确定")}</div>
    <div style="margin-top:4px">${t.pending.map((i) => `<span class="chip warn">${i} 待补</span>`).join("")}${t.done.map((i) => `<span class="chip ok">${i} 已核验</span>`).join("")}</div>
    ${t.notes.map((n) => `<div class="muted" style="font-size:12px">· ${esc(n)}</div>`).join("")}</div>` : `<span class="muted">${state.user} 在 ${state.company} 没有未完成任务</span>`;
  $("#prefs").innerHTML = m.preferences.length ? m.preferences.map((p) => `<div class="card"><div>${esc(p.content)}</div>
    <div class="muted" style="font-size:12px">${p.memory_id} · 适用 ${esc(p.scope)} · 第 ${p.revision} 版</div>
    <div style="margin-top:4px"><button data-edit="${p.memory_id}">更正</button> <button data-del="${p.memory_id}">删除</button></div></div>`).join("") : `<span class="muted">无</span>`;
  $("#prefs").onclick = async (e) => {
    const id = e.target.dataset.edit || e.target.dataset.del; if (!id) return;
    if (e.target.dataset.del) {
      if (!confirm("删除这条记忆？删除后正文会从库中清除。")) return;
      await api(`/api/memory/${id}?session_id=${state.sid}`, { method: "DELETE" });
    } else {
      const content = prompt("更正为："); if (!content) return;
      await api(`/api/memory/${id}`, { method: "PATCH", body: JSON.stringify({ session_id: state.sid, content }) });
    }
    refreshSide();
  };
  if (!$("#pane-data").hidden) renderData();
}

async function showRun(id) {
  showTab("run");
  const r = await api(`/api/runs/${id}?session_id=${state.sid}`);
  const steps = r.steps.map((s) => {
    const p = s.payload;
    if (s.kind === "llm_input") {
      const chars = p.messages.reduce((n, m) => n + String(m.content || "").length, 0);
      return `<div class="step"><details><summary>模型输入 · ${p.messages.length} 条消息 · ${chars} 字</summary>${p.messages.map((m) =>
        `<div class="muted" style="font-size:12px;margin-top:6px">&lt;${m.role}&gt;</div><pre>${esc(m.content || "")}${m.tool_calls ? "\n" + esc(JSON.stringify(m.tool_calls, null, 1)) : ""}</pre>`).join("")}</details></div>`;
    }
    if (s.kind === "llm_output") {
      const calls = (p.message.tool_calls || []).map((c) => `${c.function.name}(${c.function.arguments})`);
      return `<div class="step out"><div>模型输出：${calls.length ? "调用 " + esc(calls.join("；")) : "最终回复"}</div>
        ${p.message.reasoning_content ? `<details><summary class="muted">模型思考摘要</summary><pre>${esc(p.message.reasoning_content)}</pre></details>` : ""}</div>`;
    }
    if (s.kind === "tool") {
      const res = p.result;
      return `<div class="step tool ${res.ok ? "" : "err"}"><div><b>${esc(p.name)}</b> @${p.company_id} ${res.ok ? '<span class="chip ok">成功</span>' : `<span class="chip bad">${esc(res.error.code)}</span>`}</div>
        <details><summary class="muted">参数与结果</summary><pre>${esc(p.arguments)}</pre><pre>${esc(JSON.stringify(res.ok ? res.data : res.error, null, 1))}</pre></details></div>`;
    }
    return `<div class="step"><pre>${esc(JSON.stringify(p, null, 1))}</pre></div>`;
  }).join("");
  const sel = r.selected;
  $("#pane-run").innerHTML = `<div class="card"><div><b>${r.run_id}</b> · ${r.user_id}/${r.company_id} · ${r.status}</div>
    <div class="muted" style="font-size:12px">${r.started_at} · 模型 ${esc(r.model)} · 输入 ${r.usage.prompt_tokens ?? "-"} / 输出 ${r.usage.completion_tokens ?? "-"} tokens</div></div>
    <div class="card"><div>用户：${esc(r.user_message)}</div>
    <div style="margin-top:4px">选用记忆：${(sel.memories || []).map((m) => `<span class="chip">${m}</span>`).join("") || '<span class="muted">无</span>'}
    ${sel.task ? `<span class="chip">任务 ${sel.task}</span>` : ""}</div>
    <div>工具返回的规则：${(sel.rules_cited_by_tools || []).map((x) => `<span class="chip ok">${x}</span>`).join("") || '<span class="muted">无</span>'}</div>
    ${r.anomalies.length ? `<div style="color:var(--warn)">异常：${esc(r.anomalies.join("；"))}</div>` : ""}</div>${steps}`;
}

async function renderData() {
  const ov = await api(`/api/overview?session_id=${state.sid}`);
  if (ov.forbidden) {  // 无权访问时不请求、也不展示任何数据表
    $("#pane-data").innerHTML = `<p class="banner" style="margin:0">${esc(state.user)} 无权访问 ${esc(state.company)}，不显示该企业的数据。</p>`;
    return;
  }
  const q = `session_id=${state.sid}`;
  const [inv, ops, have] = await Promise.all([api(`/api/invoices?${q}&month=${state.month}`),
    api(`/api/operations?${q}`), api(`/api/invoice-months?${q}`)]);
  const summary = `<table class="data" style="margin-bottom:14px">
    <tr><th>月份</th><th>发票</th><th>发票总额</th><th>银行收入</th><th>银行支出</th></tr>${ov.months.map((m) =>
    `<tr><td>${m.month}</td><td>${m.invoice_count}</td><td class="num">${m.invoice_total}</td><td class="num">${m.bank_income}</td><td class="num">${m.bank_expense}</td></tr>`).join("")}</table>`;
  const months = [...new Set(["2026-07", "2026-08", "2026-09", ...have, state.month])].sort().map((m) => `<option ${m === state.month ? "selected" : ""}>${m}</option>`).join("");
  $("#pane-data").innerHTML = `<h2>${state.company} 月度汇总（程序计算）</h2>${summary}<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><b>${state.company} 发票</b>
    <select id="month" style="width:auto">${months}</select><span class="muted" style="font-size:12px">库内当前数据（非原始 Excel）</span></div>
    ${inv.length ? `<table class="data"><tr><th>编号</th><th>日期</th><th>金额</th><th>用途</th><th>备注</th><th>版</th></tr>${inv.map((i) =>
      `<tr class="${i.version > 1 ? "changed" : ""}"><td>${i.invoice_id}</td><td>${i.issue_date.slice(5)}</td><td class="num">${i.amount}</td>
      <td class="${(i.purpose || "").trim() ? "" : "blank"}">${esc(i.purpose || "（空）")}</td><td>${esc(i.remark || "")}</td><td>v${i.version}</td></tr>`).join("")}</table>` : `<p class="muted">该月没有发票记录。</p>`}
    <h2 style="margin-top:18px">保存操作（写后回读）</h2>
    ${ops.length ? ops.map((o) => `<div class="card"><div><b>${o.op_id}</b> ${o.company_id}/${o.invoice_id} <span class="chip ${o.status === "verified" ? "ok" : "bad"}">${o.status}</span></div>
      <div class="muted" style="font-size:12px">${o.created_at} · ${o.user_id} · 运行 ${o.run_id}</div>
      <div style="font-size:12px">用途：${esc(o.before_json.purpose || "（空）")} → <b>${esc(o.after_json?.purpose || "（空）")}</b>；备注：${esc(o.before_json.remark || "（空）")} → <b>${esc(o.after_json?.remark || "（空）")}</b></div></div>`).join("") : `<p class="muted">暂无保存操作。</p>`}`;
  $("#month").onchange = (e) => { state.month = e.target.value; renderData(); };
}

const IMPORT_STATUS = { would_import: ["可导入", "ok"], imported: ["已导入", "ok"], duplicate: ["已存在，跳过", ""],
                        conflict: ["同号冲突", "bad"], rejected: ["未通过校验", "bad"],
                        needs_confirmation: ["待人工确认", "bad"] };
const imp = { files: [], results: null };

function readB64(file) {
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(r.result.slice(r.result.indexOf(",") + 1));
    r.onerror = () => fail(r.error);
    r.readAsDataURL(file);
  });
}

async function uploadInvoices(commit) {
  const body = { session_id: state.sid, commit,
                 accept_buyer_mismatch: $("#impAccept")?.checked || false,
                 allow_test_samples: $("#impTest")?.checked || false,
                 confirm_ocr: $("#impOcr")?.checked || false,
                 files: await Promise.all(imp.files.map(async (f) => ({ name: f.name, data: await readB64(f) }))) };
  $("#impMsg").textContent = commit ? "导入中…" : "解析中…";
  try {
    const res = await api("/api/invoice-files", { method: "POST", body: JSON.stringify(body) });
    imp.results = res.results;
    if (res.event) {
      const ev = document.createElement("div"); ev.className = "event"; ev.textContent = "[导入] " + res.event;
      $("#log").appendChild(ev); $("#log").scrollTop = $("#log").scrollHeight;
      renderWelcome();
    }
    const n = imp.results.filter((r) => r.status === "imported").length;
    $("#impMsg").textContent = commit ? `已导入 ${n} 张。导入后可在对话中查询，用途需另行补充。` : "以下为预览，尚未写入。";
    if (commit && n) {
      imp.files = [];
      const first = imp.results.find((r) => r.status === "imported");
      state.month = first.parsed.issue_date.slice(0, 7);
    }
  } catch (e) { $("#impMsg").textContent = "失败：" + e.message; imp.results = null; }
  renderImportResults();
}

function renderImportResults() {
  const ok = imp.results?.some((r) => r.status === "would_import");
  $("#impCommit").disabled = !ok;
  $("#impResults").innerHTML = (imp.results || []).map((r) => {
    const p = r.parsed, [label, cls] = IMPORT_STATUS[r.status];
    const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
    return `<div class="card imp"><div><b>${esc(r.invoice_id || r.file)}</b> <span class="chip ${cls}">${label}</span></div>
      <div class="muted" style="font-size:12px">${esc(r.file)} · ${esc(p.invoice_type || "类型未识别")} · ${esc(p.layout)}</div>
      ${r.issues.map((x) => `<div class="issue">✕ ${esc(x)}</div>`).join("")}${r.notes.map((x) => `<div class="note">· ${esc(x)}</div>`).join("")}
      <details><summary class="muted" style="font-size:12px">票面字段</summary><dl>
        ${row("开票日期", p.issue_date)}${row("销售方", p.seller_name)}${row("销售方税号", p.seller_tax_id)}
        ${row("购买方", p.buyer_name)}${row("购买方税号", p.buyer_tax_id)}${row("项目", p.items.join("；"))}
        ${row("金额", p.amount)}${row("税额", p.tax)}${row("价税合计", p.total)}${row("大写", p.total_upper)}${row("票面备注", p.face_remark)}
        ${p.qr_info ? `${row("二维码代码", p.qr_info.code)}${row("二维码号码", p.qr_info.number)}${row("二维码日期", p.qr_info.issue_date)}${row("二维码金额（以票种口径为准）", p.qr_info.amount)}` : ""}
      </dl></details></div>`;
  }).join("");
}

function renderImport() {
  const can = permText() === "可查看并修改";
  $("#pane-import").innerHTML = `<h2>导入发票文件到 ${state.company}</h2>
    ${can ? "" : `<p class="banner" style="margin:0 0 10px">${state.user} 对 ${state.company} ${esc(permText())}，不能导入。</p>`}
    <p><a href="/ocr-review" target="_blank" rel="noopener noreferrer">制作人工核对样本</a>（图片只在浏览器处理，不会导入）</p>
    <label class="drop" id="impDrop">拖入 PDF / OFD 电子发票或扫描件、图片，或点击选择文件<input type="file" id="impFile" multiple accept=".pdf,.ofd,.png,.jpg,.jpeg,.tif,.tiff,.bmp"></label>
    <div id="impList" class="muted" style="font-size:12px;margin-bottom:8px"></div>
    ${state.meta.allow_foreign_buyer ? `<label style="display:flex;gap:6px;align-items:center;color:var(--warn)"><input type="checkbox" id="impAccept" style="width:auto">
      允许购买方不是本企业（测试模式，FH_ALLOW_FOREIGN_BUYER=1）</label>` : ""}
    ${state.meta.allow_test_samples ? `<label style="display:flex;gap:6px;align-items:center;color:var(--warn)"><input type="checkbox" id="impTest" style="width:auto">
      放行测试样张（TEST 号码，测试模式，FH_ALLOW_TEST_SAMPLES=1）</label>` : ""}
    ${state.meta.ocr ? `<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="impOcr" style="width:auto">
      识别件（扫描件、图片）：我已对照票面核对发票代码（如有）、号码和日期</label>` : ""}
    <div style="display:flex;gap:8px;margin:8px 0"><button id="impPreview" ${can ? "" : "disabled"}>解析预览</button>
      <button class="primary" id="impCommit" disabled>确认导入</button></div>
    <div class="muted" id="impMsg" style="font-size:12px;margin-bottom:8px">程序解析票面并核对金额和号码，可读取发票二维码供交叉核对。二维码不能证明票据真伪；图片需开启识别才能导入。</div>
    <div id="impResults"></div>`;
  const setFiles = (list) => {
    imp.files = [...list].filter((f) => /\.(pdf|ofd|png|jpe?g|tiff?|bmp)$/i.test(f.name)); imp.results = null; renderImportResults();
    $("#impList").textContent = imp.files.length ? `已选 ${imp.files.length} 个：${imp.files.map((f) => f.name).join("、")}` : "";
  };
  const drop = $("#impDrop");
  $("#impFile").onchange = (e) => setFiles(e.target.files);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); setFiles(e.dataTransfer.files); };
  $("#impPreview").onclick = () => imp.files.length ? uploadInvoices(false) : ($("#impMsg").textContent = "请先选择文件。");
  $("#impCommit").onclick = () => uploadInvoices(true);
  if (imp.files.length) $("#impList").textContent = `已选 ${imp.files.length} 个：${imp.files.map((f) => f.name).join("、")}`;
  renderImportResults();
}

async function renderRules() {
  let rules;
  try { rules = await api(`/api/rules?session_id=${state.sid}`); }
  catch (e) { $("#pane-rules").innerHTML = `<p class="banner" style="margin:0">${esc(e.message)}</p>`; return; }
  const ids = [...new Set(rules.map((r) => r.rule_id))];
  $("#pane-rules").innerHTML = `<h2>新增规则版本（更新 = 新版本，旧版本保留）</h2>
    <form class="rule" id="ruleForm">
      <select name="rule_id">${ids.map((i) => `<option>${i}</option>`).join("")}</select>
      <input name="version" placeholder="版本，如 1.1" required>
      <input name="effective_from" type="date" value="2026-09-01" required>
      <input name="purpose_required_min" placeholder="用途必填门槛（元，可空=从正文解析）">
      <textarea name="body" placeholder="条款原文，如：单张发票金额大于或等于 500.00 元时必须填写用途。" required></textarea>
      <button class="primary full">新增版本</button>
      <div class="muted full" id="ruleMsg" style="font-size:12px"></div>
    </form>
    <h2>${state.company} 相关规则版本</h2>` +
    rules.map((r) => `<div class="card"><div><b>${r.rule_id}</b>《${esc(r.name)}》${r.version} 版
      <span class="chip ${r.status === "active" ? "ok" : "bad"}">${r.status === "active" ? "启用" : "已停用"}</span>
      ${r.applicable_today ? '<span class="chip">今日适用</span>' : ""}
      <button style="float:right;font-size:12px;padding:0 8px" data-rid="${r.rule_id}" data-ver="${r.version}" data-st="${r.status === "active" ? "disabled" : "active"}">${r.status === "active" ? "停用" : "启用"}</button></div>
      <div class="muted" style="font-size:12px">生效 ${r.effective_from}${r.params.purpose_required_min_cents === undefined ? "" : r.params.purpose_required_min_cents === 0 ? " · 用途：每张必填" : ` · 用途必填门槛 ${(r.params.purpose_required_min_cents / 100).toFixed(2)} 元（含）`}</div>
      <details><summary class="muted">条款</summary>${r.body.map((b, i) => `<div style="font-size:13px;margin-top:4px">[${i + 1}] ${esc(b)}</div>`).join("")}</details></div>`).join("") +
    `<p class="muted" style="font-size:12px">也可用命令行管理：python -m fiscal_harness rules list / import / update / disable</p>`;
  $("#pane-rules").onclick = async (e) => {
    const b = e.target.closest("button[data-rid]"); if (!b) return;
    if (!confirm(`${b.dataset.st === "disabled" ? "停用" : "启用"} ${b.dataset.rid} ${b.dataset.ver} 版？`)) return;
    try { await api(`/api/rules/${b.dataset.rid}/${b.dataset.ver}/status`, { method: "POST", body: JSON.stringify({ session_id: state.sid, status: b.dataset.st }) }); }
    catch (err) { alert(err.message); return; }
    renderRules();
  };
  $("#ruleForm").onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    try {
      const r = await api("/api/rules", { method: "POST", body: JSON.stringify({ ...f, session_id: state.sid }) });
      $("#ruleMsg").textContent = `已新增 ${r.rule_id} ${r.version} 版，生效 ${r.effective_from}`;
      setTimeout(renderRules, 800);
    } catch (err) { $("#ruleMsg").textContent = "失败：" + err.message; }
  };
}

init().catch((e) => { $("#log").innerHTML = `<div class="event" style="color:var(--bad)">初始化失败：${esc(e.message)}</div>`; });
</script>
</body>
</html>
